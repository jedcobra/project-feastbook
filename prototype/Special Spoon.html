<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Special Spoon — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@400;600&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  button { font-family: inherit; cursor: pointer; }

  /* Canvas */
  .ss-stage {
    min-height: 100vh;
    padding: 52px 40px 80px;
    display: flex; flex-direction: column; align-items: center; gap: 48px;
    background: #E8E2CF;
  }
  .ss-header { text-align: center; max-width: 680px; }
  .ss-header h1 {
    font-family: 'Libre Caslon Text', Georgia, serif;
    font-weight: 700; font-size: 38px; letter-spacing: -0.01em;
    margin: 0 0 8px; color: #232459;
  }
  .ss-header p {
    margin: 0; color: #8B8AAF; font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px; line-height: 1.6; max-width: 480px; margin: 0 auto;
  }
  .ss-header .eyebrow {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #8B8AAF; margin-bottom: 10px;
  }
  .ss-row {
    display: flex; gap: 40px; align-items: flex-start;
    flex-wrap: wrap; justify-content: center;
  }
  .ss-device-label {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; color: #8B8AAF;
    margin-bottom: 10px; text-align: center;
    letter-spacing: 0.04em;
  }

  /* Tweaks panel */
  .ss-tweaks {
    position: fixed; bottom: 16px; right: 16px;
    width: 280px; max-height: calc(100vh - 32px);
    background: #F4EEDD; border: 1px solid #232459;
    padding: 16px; z-index: 1000;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; color: #232459;
    overflow: auto; display: none;
  }
  .ss-tweaks.on { display: block; }
  .ss-tweaks h3 {
    margin: 0 0 14px;
    font-family: 'Libre Caslon Text', Georgia, serif;
    font-weight: 700; font-size: 18px;
  }
  .ss-tweaks .section { margin-bottom: 14px; }
  .ss-tweaks .section-label {
    display: block; text-transform: uppercase; letter-spacing: 0.1em;
    font-size: 9px; color: #8B8AAF; margin-bottom: 6px;
    border-bottom: 1px dashed #CFC49C; padding-bottom: 4px;
  }
  .ss-tweaks .opts { display: flex; gap: 4px; flex-wrap: wrap; }
  .ss-tweaks .opt {
    padding: 4px 9px; border: 1px solid #232459;
    font-size: 10px; cursor: pointer; background: transparent; color: #232459;
    border-radius: 0;
  }
  .ss-tweaks .opt.on { background: #232459; color: #F4EEDD; }
  .ss-tweaks .swatches { display: flex; gap: 6px; }
  .ss-tweaks .sw {
    width: 28px; height: 28px; border: 2px solid transparent; cursor: pointer;
  }
  .ss-tweaks .sw.on { border-color: #232459; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="theme.jsx"></script>
<script type="text/babel" src="ss-primitives.jsx"></script>
<script type="text/babel" src="ss-data.jsx"></script>
<script type="text/babel" src="ss-chrome.jsx"></script>
<script type="text/babel" src="ss-feed.jsx"></script>
<script type="text/babel" src="ss-recipe.jsx"></script>
<script type="text/babel" src="ss-profile.jsx"></script>
<script type="text/babel" src="ss-cooking.jsx"></script>
<script type="text/babel" src="ss-discover.jsx"></script>
<script type="text/babel" src="ss-create.jsx"></script>
<script type="text/babel" src="ss-auth.jsx"></script>
<script type="text/babel" src="ss-create-2.jsx"></script>
<script type="text/babel" src="ss-comments.jsx"></script>
<script type="text/babel" src="ss-edit.jsx"></script>
<script type="text/babel" src="ss-onboarding.jsx"></script>
<script type="text/babel" src="ss-search.jsx"></script>
<script type="text/babel" src="ss-shelves.jsx"></script>
<script type="text/babel" src="ss-notify.jsx"></script>
<script type="text/babel" src="ss-settings.jsx"></script>
<script type="text/babel" src="ss-states.jsx"></script>
<script type="text/babel" src="ss-share.jsx"></script>
</head>
<body>
<div id="root"></div>
<div class="ss-tweaks" id="tweaks"></div>

<script type="text/babel">
const TWEAKS = /*EDITMODE-BEGIN*/{
  "theme": "cream",
  "type": "garamond",
  "feedLayout": "index",
  "detailLayout": "document",
  "showcase": "states"
}/*EDITMODE-END*/;

function SpecialSpoonApp() {
  const [tweaks, setTweaks] = React.useState(TWEAKS);

  const theme = SS_THEMES[tweaks.theme] || SS_THEMES.cream;
  const type  = SS_TYPE_PAIRS[tweaks.type] || SS_TYPE_PAIRS.bookish;
  const baseStyle = ssStyleVars(theme, type);

  // Canvas bg matches theme
  React.useEffect(() => {
    document.querySelector('.ss-stage') &&
      (document.querySelector('.ss-stage').style.background = theme.bgDeep);
  }, [theme]);

  // Tweaks panel protocol
  React.useEffect(() => {
    const handler = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode')
        document.getElementById('tweaks').classList.add('on');
      if (e.data.type === '__deactivate_edit_mode')
        document.getElementById('tweaks').classList.remove('on');
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const setTweak = (k, v) => {
    setTweaks(t => {
      const next = { ...t, [k]: v };
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
      return next;
    });
  };

  // Render tweaks panel
  React.useEffect(() => {
    const el = document.getElementById('tweaks');
    if (!el) return;

    const showcaseOpts = [
      ['prototype',       'Live prototype'],
      ['flow',            'All screens'],
      ['auth',            'Signed-out'],
      ['social',          'Notes & editing'],
      ['onboarding',      'Onboarding'],
      ['find',            'Search & shelves'],
      ['system',          'Inbox & settings'],
      ['states',          'States & sharing'],
      ['create',          'Add-recipe flow'],
      ['feed-variants',   'Feed variants'],
      ['detail-variants', 'Detail variants'],
      ['type-variants',   'Typography'],
    ];
    const feedOpts   = Object.keys(SS_FEED_LAYOUTS);
    const detailOpts = Object.keys(SS_DETAIL_LAYOUTS);
    const typeOpts   = Object.keys(SS_TYPE_PAIRS);
    const themeOpts  = Object.keys(SS_THEMES);

    el.innerHTML = `
      <h3>Tweaks</h3>
      <div class="section">
        <span class="section-label">Showcase</span>
        <div class="opts">${showcaseOpts.map(([id, n]) =>
          `<div class="opt ${tweaks.showcase === id ? 'on' : ''}" data-k="showcase" data-v="${id}">${n}</div>`
        ).join('')}</div>
      </div>
      <div class="section">
        <span class="section-label">Palette</span>
        <div class="swatches">${themeOpts.map(k => {
          const t = SS_THEMES[k];
          return `<div class="sw ${tweaks.theme === k ? 'on' : ''}" title="${t.name}"
            style="background: linear-gradient(135deg, ${t.bg} 50%, ${t.ink} 50%)"
            data-k="theme" data-v="${k}"></div>`;
        }).join('')}</div>
      </div>
      <div class="section">
        <span class="section-label">Typography</span>
        <div class="opts">${typeOpts.map(k => {
          const t = SS_TYPE_PAIRS[k];
          return `<div class="opt ${tweaks.type === k ? 'on' : ''}" data-k="type" data-v="${k}">${t.name}</div>`;
        }).join('')}</div>
      </div>
      <div class="section">
        <span class="section-label">Feed layout</span>
        <div class="opts">${feedOpts.map(k =>
          `<div class="opt ${tweaks.feedLayout === k ? 'on' : ''}" data-k="feedLayout" data-v="${k}">${SS_FEED_LAYOUTS[k]}</div>`
        ).join('')}</div>
      </div>
      <div class="section">
        <span class="section-label">Recipe detail</span>
        <div class="opts">${detailOpts.map(k =>
          `<div class="opt ${tweaks.detailLayout === k ? 'on' : ''}" data-k="detailLayout" data-v="${k}">${SS_DETAIL_LAYOUTS[k]}</div>`
        ).join('')}</div>
      </div>
    `;

    const onClick = (e) => {
      const t = e.target.closest('[data-k]');
      if (t) setTweak(t.dataset.k, t.dataset.v);
    };
    el.addEventListener('click', onClick);
    return () => el.removeEventListener('click', onClick);
  }, [tweaks]);

  if (tweaks.showcase === 'feed-variants')   return <FeedVariants   baseStyle={baseStyle} tweaks={tweaks}/>;
  if (tweaks.showcase === 'detail-variants') return <DetailVariants baseStyle={baseStyle} tweaks={tweaks}/>;
  if (tweaks.showcase === 'type-variants')   return <TypeVariants   tweaks={tweaks}/>;
  if (tweaks.showcase === 'create')          return <CreateFlow     baseStyle={baseStyle}/>;
  if (tweaks.showcase === 'auth')            return <AuthFlow       baseStyle={baseStyle}/>;
  if (tweaks.showcase === 'social')          return <SocialFlow     baseStyle={baseStyle}/>;
  if (tweaks.showcase === 'onboarding')      return <OnboardingShowcase baseStyle={baseStyle}/>;
  if (tweaks.showcase === 'find')            return <FindFlow       baseStyle={baseStyle}/>;
  if (tweaks.showcase === 'system')          return <SystemFlow     baseStyle={baseStyle}/>;
  if (tweaks.showcase === 'states')          return <StatesFlow     baseStyle={baseStyle}/>;
  if (tweaks.showcase === 'flow')            return <FullFlow       baseStyle={baseStyle} tweaks={tweaks}/>;
  return <Prototype baseStyle={baseStyle} tweaks={tweaks}/>;
}

// ─────────────────────────────────────────────────────────────
// Live prototype — single phone, real navigation
// History stack so the back button knows where to return.
// ─────────────────────────────────────────────────────────────
function Prototype({ baseStyle, tweaks }) {
  // history: stack of route objects { tab, view, recipeId, handle }
  // current screen is the top of the stack.
  const initial = { tab: 'feed', view: 'feed' };
  const [stack, setStack] = React.useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('ss-stack') || 'null');
      if (Array.isArray(saved) && saved.length) return saved;
    } catch {}
    return [initial];
  });
  React.useEffect(() => {
    localStorage.setItem('ss-stack', JSON.stringify(stack));
  }, [stack]);

  // Signed-out gate. Persisted so a refresh keeps you where you were.
  const [session, setSession] = React.useState(() => {
    try { return localStorage.getItem('ss-session') || 'out'; } catch { return 'out'; }
  });
  React.useEffect(() => { localStorage.setItem('ss-session', session); }, [session]);

  const cur = stack[stack.length - 1];
  const push = (route) => setStack(s => [...s, route]);
  const pop  = () => setStack(s => s.length > 1 ? s.slice(0, -1) : s);
  const setTab = (tab) => setStack(s => {
    // Tab switch resets the modal stack — simplest mental model.
    const baseView = tab === 'me' ? 'profile' : tab;
    const route = tab === 'me'
      ? { tab: 'me', view: 'profile', handle: 'me' }
      : tab === 'cookbook'
        ? { tab: 'cookbook', view: 'profile', handle: 'me' }
        : { tab, view: tab };
    return [route];
  });

  const [ownerSheet, setOwnerSheet] = React.useState(null);
  const [shelfSheet, setShelfSheet] = React.useState(null);
  const openRecipe  = (id)     => push({ tab: cur.tab, view: 'recipe',  recipeId: id });
  const openProfile = (handle) => push({ tab: cur.tab, view: 'profile', handle });
  const openCooking = (id)     => push({ tab: cur.tab, view: 'cooking', recipeId: id });

  // Render the current view
  let screen, showTabs = true;
  if (session !== 'in') {
    showTabs = false;
    const signIn = () => { setSession('in'); setStack([initial]); };
    screen = session === 'signup'
      ? <SSSignUpScreen onBack={() => setSession('out')} onDone={() => setSession('onboarding')} onSignIn={() => setSession('signin')}/>
      : session === 'onboarding'
        ? <SSOnboardingFlow onDone={signIn} onImport={signIn}/>
      : session === 'signin'
        ? <SSSignInScreen onBack={() => setSession('out')} onDone={signIn} onSignUp={() => setSession('signup')}/>
        : <SSLandingScreen onSignUp={() => setSession('signup')} onSignIn={() => setSession('signin')}/>;
    return (
      <div className="ss-stage">
        <div className="ss-header">
          <div className="eyebrow">Special Spoon · live prototype</div>
          <h1>Signed out</h1>
          <p>The title page you land on before an account exists. Create one — you'll go through onboarding — or sign in to go straight to the feed.</p>
        </div>
        <div><Host baseStyle={baseStyle}>{screen}</Host></div>
      </div>
    );
  }
  if (cur.view === 'feed') {
    screen = <SSFeedScreen
      layout={tweaks.feedLayout}
      onOpenRecipe={openRecipe}
      onOpenProfile={openProfile}
      onOpenSearch={() => push({ tab: cur.tab, view: 'search' })}
      onOpenNotifications={() => push({ tab: cur.tab, view: 'notifications' })}
    />;
  } else if (cur.view === 'notifications') {
    showTabs = false;
    screen = <SSNotificationsScreen
      onBack={pop}
      onOpenRecipe={openRecipe}
      onOpenProfile={openProfile}
      onSettings={() => push({ tab: cur.tab, view: 'settings' })}
    />;
  } else if (cur.view === 'settings') {
    showTabs = false;
    screen = <SSSettingsScreen
      onBack={pop}
      onProfile={() => push({ tab: cur.tab, view: 'editprofile' })}
      onAccount={() => push({ tab: cur.tab, view: 'account' })}
      onNotifications={() => push({ tab: cur.tab, view: 'notifications' })}
      onSignOut={() => { setSession('out'); setStack([initial]); }}
    />;
  } else if (cur.view === 'editprofile') {
    showTabs = false;
    screen = <SSEditProfileScreen onBack={pop} onSave={pop}/>;
  } else if (cur.view === 'account') {
    showTabs = false;
    screen = <SSAccountScreen onBack={pop}/>;
  } else if (cur.view === 'discover') {
    screen = <SSDiscoverScreen
      onOpenRecipe={openRecipe}
      onOpenProfile={openProfile}
      onOpenSearch={() => push({ tab: cur.tab, view: 'search' })}
    />;
  } else if (cur.view === 'search') {
    showTabs = false;
    screen = <SSSearchScreen
      onBack={pop}
      onOpenRecipe={openRecipe}
      onOpenProfile={openProfile}
      onOpenShelf={(id) => push({ tab: cur.tab, view: 'shelf', shelfId: id })}
    />;
  } else if (cur.view === 'shelves') {
    showTabs = false;
    screen = <SSShelvesScreen
      onBack={pop}
      onOpenShelf={(id) => push({ tab: cur.tab, view: 'shelf', shelfId: id })}
      onNewShelf={() => push({ tab: cur.tab, view: 'newshelf' })}
    />;
  } else if (cur.view === 'shelf') {
    showTabs = false;
    screen = <SSShelfScreen shelfId={cur.shelfId} onBack={pop} onOpenRecipe={openRecipe}/>;
  } else if (cur.view === 'newshelf') {
    showTabs = false;
    screen = <SSNewShelfScreen onBack={pop} onCreate={pop}/>;
  } else if (cur.view === 'profile') {
    const isOwn = cur.handle === 'me' || cur.handle === 'you';
    screen = <SSProfileScreen
      handle={cur.handle}
      isOwn={isOwn}
      onBack={pop}
      onOpenRecipe={openRecipe}
      onOpenShelf={(id) => push({ tab: cur.tab, view: 'shelf', shelfId: id })}
      onSettings={() => push({ tab: cur.tab, view: 'settings' })}
    />;
  } else if (cur.view === 'recipe') {
    screen = <SSRecipeScreen
      recipeId={cur.recipeId}
      layout={tweaks.detailLayout}
      onBack={pop}
      onCook={() => openCooking(cur.recipeId)}
      onOpenProfile={openProfile}
      onOpenComments={() => push({ tab: cur.tab, view: 'comments', recipeId: cur.recipeId })}
      onOwnerMenu={() => setOwnerSheet(cur.recipeId)}
      onSaveTo={() => setShelfSheet(cur.recipeId)}
    />;
  } else if (cur.view === 'comments') {
    showTabs = false;
    screen = <SSCommentsScreen
      recipeId={cur.recipeId}
      onBack={pop}
      onOpenProfile={openProfile}
    />;
  } else if (cur.view === 'edit') {
    showTabs = false;
    screen = <SSEditRecipeScreen
      recipeId={cur.recipeId}
      onClose={pop}
      onSave={pop}
      onRevisions={() => push({ tab: cur.tab, view: 'revisions', recipeId: cur.recipeId })}
    />;
  } else if (cur.view === 'revisions') {
    showTabs = false;
    screen = <SSRevisionsScreen recipeId={cur.recipeId} onBack={pop}/>;
  } else if (cur.view === 'cooking') {
    showTabs = false;
    screen = <SSCookingScreen
      recipeId={cur.recipeId}
      onExit={pop}
    />;
  } else if (cur.view === 'add') {
    screen = <SSNewEntryScreen
      onClose={pop}
      onCompose={() => push({ tab: 'add', view: 'composer' })}
      onImportLink={() => push({ tab: 'add', view: 'import', mode: 'confident' })}
      onPhoto={() => push({ tab: 'add', view: 'import', mode: 'uncertain' })}
      onDrafts={() => push({ tab: 'add', view: 'drafts' })}
    />;
  } else if (cur.view === 'composer') {
    showTabs = false;
    screen = <SSComposerScreen
      seed={cur.seed}
      onClose={pop}
      onGuideMe={() => push({ tab: 'add', view: 'wizard' })}
      onPublish={() => push({ tab: 'add', view: 'publish' })}
    />;
  } else if (cur.view === 'wizard') {
    showTabs = false;
    screen = <SSWizardScreen
      onClose={pop}
      onLongPage={pop}
      onPublish={() => push({ tab: 'add', view: 'publish' })}
    />;
  } else if (cur.view === 'import') {
    showTabs = false;
    screen = <SSImportReviewScreen
      mode={cur.mode}
      onBack={pop}
      onSwitchMode={() => setStack(st => [
        ...st.slice(0, -1),
        { ...cur, mode: cur.mode === 'uncertain' ? 'confident' : 'uncertain' },
      ])}
      onAccept={() => push({ tab: 'add', view: 'composer' })}
    />;
  } else if (cur.view === 'publish') {
    showTabs = false;
    screen = <SSPublishScreen
      onBack={pop}
      onDone={() => setStack([{ tab: 'cookbook', view: 'profile', handle: 'me' }])}
    />;
  } else if (cur.view === 'drafts') {
    showTabs = false;
    screen = <SSDraftsScreen
      onBack={pop}
      onOpen={() => push({ tab: 'add', view: 'composer' })}
    />;
  }

  // Build path string for the URL chip
  const path = stack.map(r => {
    if (r.view === 'recipe')   return `/recipe/${r.recipeId}`;
    if (r.view === 'profile')  return r.handle === 'me' || r.handle === 'you' ? '/me' : `/@${r.handle}`;
    if (r.view === 'cooking')  return `/cook/${r.recipeId}`;
    if (r.view === 'comments') return `/recipe/${r.recipeId}/notes`;
    if (r.view === 'edit')     return `/recipe/${r.recipeId}/edit`;
    if (r.view === 'revisions')return `/recipe/${r.recipeId}/history`;
    if (r.view === 'search')   return '/search';
    if (r.view === 'shelves')  return '/shelves';
    if (r.view === 'shelf')    return `/shelf/${r.shelfId}`;
    if (r.view === 'newshelf') return '/shelves/new';
    if (r.view === 'notifications') return '/notifications';
    if (r.view === 'settings') return '/settings';
    if (r.view === 'editprofile') return '/settings/profile';
    if (r.view === 'account')  return '/settings/account';
    if (r.view === 'import')   return `/new/import?src=${r.mode === 'uncertain' ? 'photo' : 'link'}`;
    if (r.view === 'composer') return '/new/edit';
    if (r.view === 'wizard')   return '/new/guided';
    if (r.view === 'publish')  return '/new/publish';
    if (r.view === 'drafts')   return '/new/drafts';
    if (r.view === 'add')      return '/new';
    return `/${r.view}`;
  }).join('');

  return (
    <div className="ss-stage">
      <div className="ss-header">
        <div className="eyebrow">Special Spoon · live prototype</div>
        <h1>Tap through the app</h1>
        <p>One phone, real navigation. Tap any recipe to open it, tap a name to see their cookbook, hit Start Cooking for full-screen mode. Tap <b>New</b> to add a recipe — paste a link, photograph a card, or type it out.</p>
      </div>

      {/* URL / breadcrumb chip */}
      <div style={{
        display: 'flex', alignItems: 'center', gap: 10,
        padding: '8px 16px',
        background: 'var(--ss-bg, #F4EEDD)',
        border: '1px dashed #232459',
        borderRadius: 6,
        fontFamily: 'JetBrains Mono, ui-monospace, monospace',
        fontSize: 12, color: '#232459',
        maxWidth: 'min(560px, 90vw)',
      }}>
        <button onClick={pop} disabled={stack.length === 1} style={{
          border: '1px solid #232459',
          background: stack.length === 1 ? 'transparent' : '#232459',
          color: stack.length === 1 ? '#8B8AAF' : '#F4EEDD',
          padding: '3px 8px', borderRadius: 4, fontSize: 11,
          fontFamily: 'inherit', cursor: stack.length === 1 ? 'default' : 'pointer',
          opacity: stack.length === 1 ? 0.4 : 1,
        }}>← back</button>
        <span style={{ opacity: 0.5 }}>specialspoon.app</span>
        <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{path || '/'}</span>
        <button onClick={() => { setSession('out'); setStack([initial]); }} style={{
          border: '1px solid #232459', background: 'transparent',
          color: '#232459', padding: '3px 8px', borderRadius: 4, fontSize: 11,
          fontFamily: 'inherit', cursor: 'pointer',
        }}>sign out</button>
      </div>

      <div>
        <Host baseStyle={baseStyle}>
          {screen}
          {showTabs && <SSTabBar current={cur.tab} onChange={(id) => {
            if (id === 'add') push({ tab: 'add', view: 'add' });
            else setTab(id);
          }}/>}
          {ownerSheet && <SSOwnerSheet
            recipeId={ownerSheet}
            onClose={() => setOwnerSheet(null)}
            onEdit={() => { push({ tab: cur.tab, view: 'edit', recipeId: ownerSheet }); setOwnerSheet(null); }}
            onRevisions={() => { push({ tab: cur.tab, view: 'revisions', recipeId: ownerSheet }); setOwnerSheet(null); }}
            onPrivacy={() => setOwnerSheet(null)}
          />}
          {shelfSheet && <SSAddToShelfSheet
            recipeId={shelfSheet}
            onClose={() => setShelfSheet(null)}
            onNewShelf={() => { push({ tab: cur.tab, view: 'newshelf' }); setShelfSheet(null); }}
          />}
        </Host>
      </div>
    </div>
  );
}
